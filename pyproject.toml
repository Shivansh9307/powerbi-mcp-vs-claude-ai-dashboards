[project]
name = "f1evo"
version = "0.1.0"
description = "Verification tooling for the F1 Evolution Power BI report: raw-data checks, independent KPI recomputation and PBIP model lint."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Shivansh Chauhan", email = "shivansh369.chauhan@gmail.com" }]
keywords = ["power-bi", "tmdl", "pbip", "data-quality", "formula-1", "business-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "pillow>=10.4",
    "typer>=0.12",
]

[project.scripts]
f1evo = "f1evo.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
extend-exclude = ["artifact", "tools"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["real_data: needs the raw CSVs (set F1_RAW_DIR); skipped otherwise"]
